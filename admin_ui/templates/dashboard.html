{% extends "base.html" %}
{% block content %}

<div class="dash">
  <h1>Dashboard</h1>

  <div class="dash-stats">
    <div class="stat-box stat-box--pending">
      <span class="stat-box__value">{{ pending }}</span>
      <span class="stat-box__label">Pendientes</span>
    </div>
    <div class="stat-box stat-box--done">
      <span class="stat-box__value">{{ listos }}</span>
      <span class="stat-box__label">Listos</span>
    </div>
  </div>

  <div class="dash-center">
    <form method="post" action="{{ url_for('run_pipeline') }}" id="pipelineForm" class="play-wrap">
      <button type="submit" class="btn-play" id="playBtn"
              {% if pipeline_running %}disabled{% endif %}
              title="Ejecutar pipeline completo">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
      </button>
      <span class="play-label" id="playLabel">
        {% if pipeline_running %}Pipeline en ejecución...{% else %}Ejecutar pipeline{% endif %}
      </span>
      <div class="play-bar {% if pipeline_running %}play-bar--active{% endif %}" id="playBar">
        <div class="play-bar__fill"></div>
      </div>
    </form>

    <form method="post" action="{{ url_for('extract') }}" id="extractForm">
      <button type="submit" class="btn btn--lg"
              {% if pipeline_running %}disabled style="opacity:.5;cursor:not-allowed"{% endif %}>
        Extraer productos
      </button>
    </form>
  </div>
</div>

<script>
(function() {
  var form = document.getElementById('pipelineForm');
  if (!form) return;
  form.addEventListener('submit', function(e) {
    e.preventDefault();
    var btn = document.getElementById('playBtn');
    var bar = document.getElementById('playBar');
    var label = document.getElementById('playLabel');
    btn.disabled = true;
    bar.classList.add('play-bar--active');
    label.textContent = 'Procesando...';
    fetch(form.action, { method: 'POST' })
      .then(function(r) { return r.json(); })
      .then(function(data) {
        if (data.ok) { window.location.href = data.redirect; }
        else {
          alert('Error: ' + (data.error || 'Error desconocido'));
          btn.disabled = false;
          bar.classList.remove('play-bar--active');
          label.textContent = 'Ejecutar pipeline';
        }
      })
      .catch(function(err) {
        alert('Error de red: ' + err);
        btn.disabled = false;
        bar.classList.remove('play-bar--active');
        label.textContent = 'Ejecutar pipeline';
      });
  });

  var extractForm = document.getElementById('extractForm');
  if (!extractForm) return;
  extractForm.addEventListener('submit', function(e) {
    e.preventDefault();
    var btn = extractForm.querySelector('button[type="submit"]');
    btn.disabled = true;
    btn.style.opacity = '0.5';
    fetch(extractForm.action, { method: 'POST' })
      .then(function(r) { return r.json(); })
      .then(function(data) {
        if (data.ok) { window.location.href = data.redirect; }
        else { alert('Error: ' + (data.error || 'Error desconocido')); btn.disabled = false; btn.style.opacity = ''; }
      })
      .catch(function(err) { alert('Error de red: ' + err); btn.disabled = false; btn.style.opacity = ''; });
  });
})();
</script>
{% endblock %}
