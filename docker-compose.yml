services:
  db:
    image: mariadb:10.11
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: prestashop
      MYSQL_USER: prestashop
      MYSQL_PASSWORD: prestashop
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost", "-u", "root", "-proot123"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - psnet

  prestashop:
    image: prestashop/prestashop:8.1
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:80"
    environment:
      DB_SERVER: db
      DB_NAME: prestashop
      DB_USER: prestashop
      DB_PASSWD: prestashop
      ADMIN_MAIL: admin@prestashop.com
      ADMIN_PASSWD: admin123
      PS_DOMAIN: localhost:8080
      PS_FOLDER_ADMIN: admin
      PS_LANGUAGE: es
      PS_COUNTRY: ES
      PS_INSTALL_AUTO: 1
    volumes:
      - prestashop_data:/var/www/html
    networks:
      - psnet

volumes:
  db_data:
  prestashop_data:

networks:
  psnet:
